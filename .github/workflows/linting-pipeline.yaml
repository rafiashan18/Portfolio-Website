name: Linting Pipeline

# Trigger on push and pull request events for develop branch
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    # Use Ubuntu runner
    runs-on: ubuntu-latest
    
    steps:
    # Checkout the code
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    # Install dependencies
    - name: Install dependencies
      run: |
        npm install --save-dev htmlhint stylelint stylelint-config-standard
    
    # Run HTMLHint on all HTML files
    - name: Run HTMLHint
      run: |
        npx htmlhint "**/*.html"
    
    # Run Stylelint on all CSS files
    - name: Run Stylelint
      run: |
        npx stylelint "**/*.css"